server:
  port: 8087

spring:
  application:
    name: nordicagent-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nordicagent}
    username: ${DB_USER:nordicagent}
    password: ${DB_PASSWORD:change_me_in_env}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://nordicagent.se}
  admin:
    username: ${ADMIN_USER:security-admin}
    password: ${ADMIN_PASSWORD:ChangeMeStrong12+!}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
