server:
  port: 8087

spring:
  application:
    name: nordicagent-backend
  # Standard för lokal körning i IntelliJ IDEA utan att PostgreSQL behöver vara startat.
  # För PostgreSQL (Docker / Produktion): sätt SPRING_PROFILES_ACTIVE=postgres
  datasource:
    url: ${DB_URL:jdbc:h2:mem:nordicagent;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://nordicagent.se}
  admin:
    username: ${ADMIN_USER:security-admin}
    password: ${ADMIN_PASSWORD:ChangeMeStrong12+!}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
