services:
  postgres:
    image: postgres:16-alpine
    container_name: nordicagent-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-nordicagent}
      POSTGRES_USER: ${DB_USER:-nordicagent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nordicagent} -d ${DB_NAME:-nordicagent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nordicagent-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-nordicagent}
      DB_USER: ${DB_USER:-nordicagent}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_env}
      ADMIN_USER: ${ADMIN_USER:-security-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMeStrong12+!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,https://nordicagent.se}
    ports:
      - "8087:8087"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nordicagent-frontend
    depends_on:
      - backend
    ports:
      - "3000:8080"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pgdata:
